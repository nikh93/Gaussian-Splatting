name: Build

# Builds the Android APK and the Windows/Linux server on every push and publishes
# them as the pre-release "latest-build" (Releases page of the repository).
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

# a newer push replaces a running build, so an older run cannot overwrite the release
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build the Google Cardboard SDK (official release, not on Maven)
        working-directory: android
        run: bash cardboard/build_cardboard_sdk.sh
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../GaussianSplatting.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: GaussianSplatting.apk

  windows:
    name: Windows server (CUDA)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure and build
        working-directory: desktop
        run: |
          cmake -B build -DGS_WITH_OPENCL=OFF
          cmake --build build --config Release
      - name: Package with NVRTC (runtime kernel compiler, NVIDIA redistributable)
        shell: pwsh
        run: |
          $pkg = "gsplat-server-windows"
          New-Item -ItemType Directory -Force -Path $pkg/kernels | Out-Null
          Copy-Item desktop/build/Release/gsplat-server.exe $pkg/
          Copy-Item desktop/kernels/* $pkg/kernels/
          # NVRTC 12.4 produces PTX that runs with NVIDIA drivers >= 550
          pip download nvidia-cuda-nvrtc-cu12==12.4.127 --no-deps --only-binary=:all: --platform win_amd64 -d whl
          $whl = Get-ChildItem whl/*.whl | Select-Object -First 1
          Expand-Archive -Path $whl.FullName -DestinationPath nvrtc
          Get-ChildItem nvrtc -Recurse -Filter *.dll | Where-Object { $_.Name -notlike "*.alt.*" } | Copy-Item -Destination $pkg/
          @"
          Gaussian Splatting server (CUDA)

          Voraussetzung: NVIDIA-Grafikkarte mit aktuellem Treiber (Version 550 oder neuer).
          Ein CUDA Toolkit wird nicht benoetigt (NVRTC liegt bei).

            gsplat-server.exe --list-devices
            gsplat-server.exe --selftest
            gsplat-server.exe --port 8080

          Danach in der App die Tailscale-IP dieses PCs und Port 8080 eintragen.
          "@ | Out-File -Encoding utf8 $pkg/LIESMICH.txt
          Compress-Archive -Path $pkg -DestinationPath "$pkg.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-server
          path: gsplat-server-windows.zip

  linux:
    name: Linux server + self test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenCL (PoCL CPU runtime for the tests)
        run: sudo apt-get update && sudo apt-get install -y ocl-icd-opencl-dev opencl-headers pocl-opencl-icd
      - name: Build
        working-directory: desktop
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j
      - name: Self test (gradients, scan, sort, binning, densification on PoCL)
        working-directory: desktop
        run: ./build/gsplat-server --backend opencl --selftest
      - name: Package
        run: |
          mkdir -p gsplat-server-linux
          cp desktop/build/gsplat-server gsplat-server-linux/
          cp -r desktop/build/kernels gsplat-server-linux/
          tar czf gsplat-server-linux.tar.gz gsplat-server-linux
      - uses: actions/upload-artifact@v4
        with:
          name: linux-server
          path: gsplat-server-linux.tar.gz

  release:
    name: Publish pre-release
    needs: [android, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Replace the "latest-build" pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest-build --yes --cleanup-tag || true
          gh release create latest-build dist/* --prerelease --target "$GITHUB_SHA" \
            --title "Aktueller Build ($GITHUB_REF_NAME, ${GITHUB_SHA::7})" \
            --notes "Automatisch gebaut aus ${GITHUB_REF_NAME} @ ${GITHUB_SHA}.

          - GaussianSplatting.apk: Android-App (Debug-signiert, zum direkten Installieren)
          - gsplat-server-windows.zip: Desktop-Server fuer Windows mit CUDA (NVIDIA-Treiber >= 550)
          - gsplat-server-linux.tar.gz: Desktop-Server fuer Linux (CUDA + OpenCL)"
